name: Rebuild FFmpeg (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-ffmpeg.yml'
      - 'Package.swift'
      - 'Plugins/BuildFFmpeg/**'

# Allow the bot to commit the regenerated xcframeworks back to main.
permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild FFmpeg n8.1 xcframeworks (ios + isimulator)
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          XCODE_APP=$(ls /Applications | grep '^Xcode_.*\.app$' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install build toolchain
        run: |
          brew update || true
          # Essentials the BuildFFmpeg plugin needs, plus the gmp/nettle/gnutls
          # autotools toolchain. The plugin also auto-installs on demand, but
          # pre-installing is faster and more reliable on CI.
          brew install pkg-config nasm meson cmake sdl2 \
            texinfo autoconf automake libtool bison wget libtasn1

      - name: Show FFmpeg label
        run: |
          echo "Library.FFmpeg.version label (controls which branch the plugin clones):"
          grep -A2 'case .FFmpeg:' Plugins/BuildFFmpeg/main.swift | head -3 || true

      - name: Rebuild (BuildFFmpeg plugin, ios + isimulator only)
        run: |
          swift package --disable-sandbox BuildFFmpeg \
            platforms=ios,isimulator \
            enable-gmp enable-nettle enable-gnutls enable-libdav1d \
            enable-libfreetype enable-libfribidi enable-libharfbuzz enable-libass enable-FFmpeg

      - name: Verify rebuilt binaries are FFmpeg 8.x (version gate)
        run: |
          set -e
          AVC_HDR=$(find Sources/Libavcodec.xcframework -name version_major.h -path '*ios-arm64*' | head -1)
          AVF_HDR=$(find Sources/Libavformat.xcframework -name version_major.h -path '*ios-arm64*' | head -1)
          AVFILTER_HDR=$(find Sources/Libavfilter.xcframework -name version_major.h -path '*ios-arm64*' | head -1)
          echo "avcodec header:   $AVC_HDR"
          echo "avformat header:  $AVF_HDR"
          echo "avfilter header:  $AVFILTER_HDR"
          AVC=$(grep -E '^#define LIBAVCODEC_VERSION_MAJOR' "$AVC_HDR" | grep -oE '[0-9]+')
          AVF=$(grep -E '^#define LIBAVFORMAT_VERSION_MAJOR' "$AVF_HDR" | grep -oE '[0-9]+')
          AVFILTER=$(grep -E '^#define LIBAVFILTER_VERSION_MAJOR' "$AVFILTER_HDR" | grep -oE '[0-9]+')
          echo "LIBAVCODEC_VERSION_MAJOR=$AVC  (expect 62)"
          echo "LIBAVFORMAT_VERSION_MAJOR=$AVF  (expect 62)"
          echo "LIBAVFILTER_VERSION_MAJOR=$AVFILTER  (expect 11)"
          [ "$AVC" = "62" ] || { echo "::error::avcodec major != 62 (got $AVC)"; exit 1; }
          [ "$AVF" = "62" ] || { echo "::error::avformat major != 62 (got $AVF)"; exit 1; }
          [ "$AVFILTER" = "11" ] || { echo "::error::avfilter major != 11 (got $AVFILTER)"; exit 1; }

      # Fallback: upload the regenerated xcframeworks so they can be recovered if
      # the commit-back step below fails.
      - name: Upload regenerated xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-xcframeworks
          path: Sources/*.xcframework

      - name: Commit regenerated xcframeworks back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/*.xcframework
          if git diff --cached --quiet; then
            echo "No xcframework changes to commit."
          else
            git commit -m "Rebuild FFmpeg 8.x xcframeworks (ios + isimulator)

          Generated by rebuild-ffmpeg.yml (BuildFFmpeg plugin, platforms=ios,isimulator).
          Version gate: avcodec/avformat major=62, avfilter major=11."
            git push
          fi
