name: rebuild-ffmpeg-ios

# Rebuilds the Libav* (+ gmp/nettle/gnutls/smbclient) xcframeworks with the
# TMPDIR-aware avpriv_tempfile patch (Plugins/BuildFFmpeg/patch/FFmpeg/),
# fixing the FFmpeg `cache:` protocol on iOS (avpriv_tempfile hardcodes /tmp,
# which is not writable in the sandbox). Only iOS + iOS-simulator are built;
# every other committed xcframework stays untouched.
on:
  workflow_dispatch:
  push:
    branches:
      - ksplayer-tmpdir-fix

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched FFmpeg (ios + isimulator)
        run: |
          set -e
          swift --version
          swift package --disable-sandbox BuildFFmpeg platforms=ios,isimulator enable-FFmpeg 2>&1 | tail -80

      - name: Verify patch landed in source + binary
        run: |
          set -e
          SRC=$(find .Script -path '*FFmpeg-n6.1/libavutil/file_open.c' | head -1)
          echo "source: $SRC"
          grep -q 'getenv("TMPDIR")' "$SRC" || { echo "::error::patch NOT applied to FFmpeg source"; exit 1; }
          echo "source patch ✓"
          BIN=$(find .Script/FFmpeg/ios -name Libavutil | head -1)
          echo "binary: $BIN"
          if ! strings "$BIN" | grep -q TMPDIR; then
            echo "::error::TMPDIR not found in rebuilt Libavutil binary"
            exit 1
          fi
          echo "binary patch ✓"

      - name: Gate headers still present (avcodec/avformat/avfilter)
        run: |
          set -e
          for lib in Libavcodec Libavformat Libavfilter; do
            VM=$(find Sources/$lib.xcframework -name version_major.h -path '*ios-arm64*' | head -1)
            test -n "$VM" || { echo "::error::$lib version_major.h missing in ios-arm64"; exit 1; }
            echo "$lib: $(grep -E '^#define LIBAV.*VERSION_MAJOR' "$VM" | tr '\n' ' ')"
          done

      - name: Commit rebuilt xcframeworks
        run: |
          git config user.name "KSPlayer Bot"
          git config user.email "826944520@qq.com"
          git add -A Sources
          git status --short | head -30
          git commit -m "Rebuild Libav*/gmp/nettle/gnutls/smbclient xcframeworks with TMPDIR-aware avpriv_tempfile (iOS cache: protocol fix)" || echo "no changes to commit"
          git push origin ksplayer-tmpdir-fix
