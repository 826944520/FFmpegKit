name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    name: Build FFmpegKit (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          XCODE_APP=$(ls /Applications | grep '^Xcode_.*\.app$' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Print committed FFmpeg version (header-level)
        run: |
          HDR=$(find Sources/Libavcodec.xcframework -name version_major.h -path '*ios-arm64*' 2>/dev/null | head -1)
          if [ -n "$HDR" ]; then
            echo "Libavcodec version_major.h ($HDR):"
            grep -E 'LIBAVCODEC_VERSION_MAJOR' "$HDR"
          else
            echo "::warning::version_major.h not found under Sources/Libavcodec.xcframework"
          fi

      - name: Build FFmpegKit for iOS Simulator
        run: swift build --sdk `xcrun -sdk iphonesimulator -show-sdk-path` -Xswiftc -target -Xswiftc arm64-apple-ios13.0-simulator
